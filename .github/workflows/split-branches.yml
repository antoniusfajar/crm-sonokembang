# Setiap push ke main:
#  1. isi website/ -> branch "website", isi vps-server/ -> branch "server-vps"
#  2. hosting menarik branch "website" & VPS menjalankan deploy.sh, keduanya lewat SSH
name: Pisah branch & deploy

on:
  push:
    branches: [main]
    paths: ['website/**', 'vps-server/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: split-branches
  cancel-in-progress: false

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Split & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix=website -b split-website
          git push --force origin split-website:website
          git subtree split --prefix=vps-server -b split-vps
          git push --force origin split-vps:server-vps

  deploy-website:
    needs: split
    runs-on: ubuntu-latest
    # Aktif setelah secret HOSTING_SSH_HOST diisi
    env:
      HOST: ${{ secrets.HOSTING_SSH_HOST }}
      PORT: ${{ secrets.HOSTING_SSH_PORT }}
      USER: ${{ secrets.HOSTING_SSH_USER }}
    steps:
      - name: Pull di hosting
        if: env.HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTING_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "${PORT:-65002}" "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Perintah yang dijalankan dikunci di authorized_keys hosting (command="...")
          ssh -p "${PORT:-65002}" "$USER@$HOST"

  deploy-vps:
    needs: split
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.VPS_SSH_HOST }}
      USER: ${{ secrets.VPS_SSH_USER }}
    steps:
      - name: Deploy di VPS
        if: env.HOST != ''
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          # Perintah dikunci di authorized_keys VPS: bash /opt/SK-Crm/deploy.sh
          ssh "$USER@$HOST"
